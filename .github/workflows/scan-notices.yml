name: Paper Radar - Check official notices

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 00:17 UTC = 09:17 Asia/Seoul.
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: paper-radar-notice-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Check official journal notice boards
        run: python scripts/scan.py
      - name: Commit scanned notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/notices.json site/data/scan.json
          if git diff --cached --quiet; then
            echo 'No updates to commit'
          else
            git commit -m 'chore: scan official journal announcements'
            git push
          fi
