name: Paper Radar - Update KCI publication schedules

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_schedules.py'
      - '.github/workflows/scan-notices.yml'
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 00:17 UTC = 09:17 Asia/Seoul.
    - cron: '17 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-radar-kci-update
  cancel-in-progress: false

jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Refresh and save ten journals at a time
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          flag=--begin
          while true; do
            python scripts/refresh_schedules.py $flag
            flag=
            git add site/data/journals.json site/data/kci_enrichment_report.json
            git commit -m "chore: checkpoint verified KCI schedules"
            git push
            if python -c 'import json, sys; sys.exit(int(json.load(open("site/data/kci_enrichment_report.json"))["in_progress"]))'; then break; fi
          done

      # GITHUB_TOKEN commits do not trigger the branch-based Pages build.
      # Publish this checkout directly so refreshed JSON reaches the website.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
